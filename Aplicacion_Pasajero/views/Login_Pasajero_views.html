<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta http-equiv="X-UA-Compatible" content="ie=edge">
		<link rel="stylesheet" href="../views/css/bootstrap.min.css">
		<title>LOGIN PASAJERO</title>
		<style type="text/css">
			body { background-color: #bebebe; }
		</style>
	</head>      
	<body>
		<div class="container py-5" style="font-family: Arial, Helvetica, sans-serif;">
			<div class="card border-light text-center px-5 py-5 my-5" style="background:rgba(0,0,0,0.8);">
				<h1 class="display-4 text-white">Iniciar Sesión</h1>
				<p class="lead text-white pt-3">Rellene los campos para iniciar sesión.</p>
				<div class="card-body">
					<form method="post">
						<div class="form-group pb-3">
							<input type="text" name="nick" class="form-control-lg w-50 text-center" placeholder="Usuario" autofocus>
						</div>
						<div class="form-group pb-3">
							<input type="password" name="password" class="form-control-lg w-50 text-center" placeholder="Contraseña">
						</div>
						<input type="submit" style="font-size: medium; font-weight: bold;" value="Iniciar Sesión" class="w-50 btn btn-outline-light btn-lg">
						<h5 class="text-white pt-3">¿No tiene cuenta?&nbsp;
							<a style="color: #41a5ee;" href="">Regístrese</a>
						</h5>
						<h5 class="text-white">¿Olvidó su contraseña?&nbsp;
							<a style="color: #41a5ee;" href="">Restaurar contraseña</a>
						</h5>
					</form>
				</div>
			</div>
		</div>
	</body>
</html>
